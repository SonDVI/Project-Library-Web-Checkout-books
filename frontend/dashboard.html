<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | HUST LBC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/index.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css?v=99" />
  </head>
  <body>
    <nav>
      <div class="container">
        <a href="index.html" class="logo metallic-gold">HUST LBC</a>
        <ul class="nav-links">
          <li><a href="catalog.html" data-i18n="navCatalog">Catalog</a></li>
          <li>
            <a href="dashboard.html" class="active" data-i18n="navDashboard"
              >Dashboard</a
            >
          </li>
          <li><a href="profile.html" data-i18n="navProfile">Profile</a></li>
          <li><a href="setting.html" data-i18n="navSetting">Setting</a></li>

          <li id="nav-login-wrapper">
            <a href="login.html" data-i18n="navLogin">Login</a>
          </li>

          <li
            class="user-nav-wrapper"
            id="nav-user-profile"
            style="display: none">
            <div class="user-info-box">
              <span class="user-icon">👤</span>
              <span id="user-display-name">Tên User</span>
            </div>
            <button id="logout-btn" class="btn-logout" data-i18n="navLogout">
              Đăng xuất
            </button>
          </li>
        </ul>
      </div>
    </nav>

    <main class="dashboard-main">
      <div class="ambient-glow"></div>

      <div class="container">
        <header class="dash-header fade-in-up" style="animation-delay: 0.1s">
          <h1 class="dash-title" data-i18n="dashTitle">
            Library <span class="metallic-gold">Command Center</span>
          </h1>
          <p class="dash-subtitle" data-i18n="dashSubtitle">
            Tổng quan dữ liệu mượn trả và xu hướng đọc sách mới nhất.
          </p>
        </header>

        <div class="bento-grid">
          <div
            class="bento-card card-leaderboard fade-in-up"
            style="animation-delay: 0.2s">
            <div class="card-head">
              <h3 data-i18n="dashTopReaders">Top Độc Giả</h3>
              <span class="badge">Live</span>
            </div>
            <div class="fintech-list" id="leaderboard-list"></div>
          </div>

          <div
            class="bento-card card-trending fade-in-up"
            style="animation-delay: 0.3s">
            <div class="card-head">
              <h3 data-i18n="dashTrendingBooks">Sách Thịnh Hành</h3>
              <div class="pill-filters" id="trending-filters">
                <button
                  class="pill-btn active"
                  data-time="day"
                  data-i18n="timeToday">
                  Hôm nay
                </button>
                <button
                  class="pill-btn"
                  data-time="month"
                  data-i18n="timeThisMonth">
                  Tháng này
                </button>
                <button
                  class="pill-btn"
                  data-time="year"
                  data-i18n="timeThisYear">
                  Năm nay
                </button>
              </div>
            </div>
            <div class="trending-grid" id="trending-books-grid"></div>
          </div>

          <div
            class="bento-card card-authors fade-in-up"
            style="animation-delay: 0.4s">
            <div class="card-head">
              <h3 data-i18n="dashAuthorRankings">Bảng Xếp Hạng Tác Giả</h3>
              <select class="luxury-select" id="author-sort-select">
                <option value="views" data-i18n="sortViews">
                  🔥 Theo Lượt Xem
                </option>
                <option value="borrows" data-i18n="sortBorrows">
                  📚 Theo Số Lần Mượn
                </option>
                <option value="votes" data-i18n="sortVotes">
                  ⭐ Theo Lượt Vote
                </option>
                <option value="loves" data-i18n="sortLoves">
                  ❤️ Theo Lượt Yêu Thích
                </option>
              </select>
            </div>
            <div class="author-list" id="author-ranking-list"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/dashboard/dashboard.js?v=99"></script>
  </body>
</html>
