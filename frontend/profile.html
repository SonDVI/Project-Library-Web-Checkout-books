<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ Sơ Của Tôi | HUST LBC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/profile.css?v=2" />
  </head>
  <body>
    <nav>
      <div class="container">
        <a href="index.html" class="logo metallic-gold">HUST LBC</a>
        <ul class="nav-links">
          <li><a href="catalog.html" data-i18n="navCatalog">Catalog</a></li>
          <li>
            <a href="dashboard.html" class="active" data-i18n="navDashboard"
              >Dashboard</a
            >
          </li>
          <li><a href="profile.html" data-i18n="navProfile">Profile</a></li>
          <li><a href="setting.html" data-i18n="navSetting">Setting</a></li>

          <li id="nav-login-wrapper">
            <a href="login.html" data-i18n="navLogin">Login</a>
          </li>
          <li
            class="user-nav-wrapper"
            id="nav-user-profile"
            style="display: none">
            <div class="user-info-box">
              <span class="user-icon">👤</span>
              <span id="user-display-name">Tên User</span>
            </div>
            <button id="logout-btn" class="btn-logout" data-i18n="navLogout">
              Đăng xuất
            </button>
          </li>
        </ul>
      </div>
    </nav>

    <main class="profile-main">
      <div class="container profile-grid">
        <div class="profile-sidebar">
          <div class="luxury-card-wrapper">
            <div class="digital-black-card">
              <div class="card-glow"></div>
              <div class="card-header-v">
                <span class="card-logo">HUST LBC</span>
                <span class="card-type">VIP MEMBER</span>
              </div>
              <div class="card-chip"></div>
              <div class="card-holder-info">
                <div class="card-name" id="card-holder-name">
                  NGUYỄN BẢO SƠN
                </div>
                <div class="card-meta">MSSV: 20256789 | Viện ĐTVT</div>
              </div>
              <div class="card-barcode">
                <div class="barcode-line"></div>
                <div class="barcode-text">ET-E16-MULTIMEDIA</div>
              </div>
            </div>
          </div>
          <p class="sidebar-tip">
            ✨ Thẻ điện tử tự động kích hoạt dựa trên mã sinh viên đăng nhập.
          </p>
        </div>

        <div class="profile-content">
          <h2 class="section-title">
            Hồ Sơ <span class="metallic-gold">Cá Nhân</span>
          </h2>

          <form id="profile-edit-form" class="luxury-form">
            <div class="form-row">
              <div class="form-group">
                <label>Họ và Tên</label>
                <input
                  type="text"
                  id="input-fullname"
                  value="Nguyễn Bảo Sơn"
                  class="luxury-input" />
              </div>
              <div class="form-group">
                <label>Mã Số Sinh Viên</label>
                <input
                  type="text"
                  value="20256789"
                  class="luxury-input"
                  disabled
                  style="opacity: 0.5; cursor: not-allowed" />
              </div>
            </div>
            <div class="form-group">
              <label>Chuyên Ngành / Lớp</label>
              <input
                type="text"
                value="Truyền thông số & Kỹ thuật đa phương tiện (ET-E16)"
                class="luxury-input"
                disabled
                style="opacity: 0.5" />
            </div>

            <h2 class="section-title" style="margin-top: 3rem">
              Bảo Mật <span class="metallic-gold">Tài Khoản</span>
            </h2>
            <div class="form-group">
              <label>Mật khẩu hiện tại</label>
              <input
                type="password"
                placeholder="••••••••"
                class="luxury-input" />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Mật khẩu mới</label>
                <input
                  type="password"
                  placeholder="Nhập mật khẩu mới"
                  class="luxury-input" />
              </div>
              <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input
                  type="password"
                  placeholder="Xác nhận mật khẩu"
                  class="luxury-input" />
              </div>
            </div>

            <button
              type="submit"
              class="btn btn-gold btn-large"
              style="margin-top: 1.5rem">
              Cập Nhật Hồ Sơ
            </button>
          </form>
        </div>
      </div>
    </main>
    <script src="assets/js/i18n.js"></script>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/profile/profile.js"></script>
  </body>
</html>
