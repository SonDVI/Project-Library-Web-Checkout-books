<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalog - Khám Phá | HUST LBC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/index.css" />
    <link rel="stylesheet" href="assets/css/catalog.css?v=100" />
  </head>
  <body>
    <nav>
      <div class="container">
        <a href="index.html" class="logo metallic-gold">HUST LBC</a>
        <ul class="nav-links">
          <li>
            <a href="catalog.html" class="active" data-i18n="navCatalog"
              >Catalog</a
            >
          </li>
          <li>
            <a href="dashboard.html" data-i18n="navDashboard">Dashboard</a>
          </li>
          <li id="nav-admin-link" style="display: none">
            <a href="admin.html" style="color: #ff4757; font-weight: 600"
              >👑 Quản Trị</a
            >
          </li>
          <li><a href="profile.html" data-i18n="navProfile">Profile</a></li>
          <li><a href="setting.html" data-i18n="navSetting">Setting</a></li>

          <li id="nav-login-wrapper">
            <a href="login.html" data-i18n="navLogin">Login</a>
          </li>
          <li
            class="user-nav-wrapper"
            id="nav-user-profile"
            style="display: none">
            <div class="user-info-box">
              <span class="user-icon">👤</span>
              <span id="user-display-name">Tên User</span>
            </div>
            <button id="logout-btn" class="btn-logout" data-i18n="navLogout">
              Đăng xuất
            </button>
          </li>
        </ul>
      </div>
    </nav>
    <main>
      <section class="page-header fade-in-up" style="animation-delay: 0.1s">
        <div class="container">
          <h1 class="page-title" data-i18n-html="pageTitleCatalog">
            Danh Mục <span class="metallic-gold">Sách</span>
          </h1>
          <p class="page-description" data-i18n="pageDescCatalog">
            Khám phá bộ sưu tập sách phong phú có sẵn để mượn
          </p>

          <div
            class="search-engine-wrapper fade-in-up"
            style="animation-delay: 0.2s">
            <select id="search-category" class="search-select">
              <option value="all" data-i18n="filterAllCategories">
                Tất cả
              </option>
              <option value="title" data-i18n="sortTitleAZ">Tên sách</option>
              <option value="author" data-i18n="sortAuthorAZ">Tác giả</option>
            </select>
            <input
              type="text"
              id="catalog-search"
              class="search-main-input"
              data-i18n-placeholder="searchPlaceholder"
              placeholder="Tìm kiếm sách, tác giả..."
              autocomplete="off" />
            <button class="btn-search-icon">🔍</button>

            <div class="suggest-dropdown" id="suggest-box"></div>
          </div>
        </div>
      </section>

      <section class="books-catalog">
        <div class="container catalog-layout">
          <aside
            class="catalog-sidebar fade-in-up"
            style="animation-delay: 0.3s">
            <div class="filter-group">
              <h3 class="filter-title" data-i18n="filterSortTitle">Sắp Xếp</h3>
              <select class="filter-select-box" id="sort-select">
                <option data-i18n="sortNewest">Mới nhất</option>
                <option data-i18n="sortOldest">Cũ nhất</option>
                <option data-i18n="sortTitleAZ">Tiêu đề (A-Z)</option>
                <option data-i18n="sortAuthorAZ">Tác giả (A-Z)</option>
              </select>
            </div>

            <div class="filter-group">
              <h3 class="filter-title" data-i18n="filterCategoryTitle">
                Danh Mục
              </h3>
              <label class="custom-radio">
                <span data-i18n="filterAllCategories">Tất Cả Thể Loại</span>
                <input type="radio" name="cat" value="all" checked />
                <span class="radiomark"></span>
              </label>
              <label class="custom-radio">
                <span data-i18n="filterLiterature">Văn Học</span>
                <input type="radio" name="cat" value="lit" />
                <span class="radiomark"></span>
              </label>
              <label class="custom-radio">
                <span data-i18n="filterEngineering">Kỹ Thuật</span>
                <input type="radio" name="cat" value="tech" />
                <span class="radiomark"></span>
              </label>
            </div>

            <div class="filter-group">
              <h3 class="filter-title" data-i18n="filterStatusTitle">
                Tình Trạng
              </h3>
              <label class="custom-check">
                <span data-i18n="statusAvailable">Sẵn sàng mượn</span>
                <input type="checkbox" id="filter-available" checked />
                <span class="checkmark"></span>
              </label>
            </div>
            <div class="filter-group">
              <h3 class="filter-title" data-i18n="filterPersonalTitle">
                Cá Nhân
              </h3>
              <label class="custom-check">
                <span
                  data-i18n="filterFavorite"
                  style="color: #ff4757; font-weight: 500"
                  >❤️ Sách tôi yêu thích</span
                >
                <input type="checkbox" id="filter-favorite" />
                <span class="checkmark"></span>
              </label>
            </div>
          </aside>

          <div
            class="catalog-content-area fade-in-up"
            style="animation-delay: 0.4s">
            <div
              class="products-grid"
              id="books-render-area"
              style="grid-template-columns: repeat(3, 1fr)"></div>
            <div class="pagination-container">
              <button class="page-btn nav-btn" id="prev-page">⟪</button>
              <div id="page-numbers" class="page-numbers"></div>
              <button class="page-btn nav-btn" id="next-page">⟫</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <div class="footer-logo metallic-gold reveal">HUST LBC</div>
        <p class="reveal stagger-1" data-i18n="footerCopyright">
          &copy; 2026 HUST LBC. Crafted with hyperrealistic precision.
        </p>
      </div>
    </footer>

    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/catalog/catalog.js?v=100"></script>
  </body>
</html>
